name: ii03012 lab 2 coverage
on:
  push:
    branches: [task_02_ii03012]
  pull_request:
    paths:
      - 'trunk/ii03012/task_02/**'
      - 'trunk/ii03012/task_01/src/**'
      - 'trunk/ii03004/task_01/src/**'
      - '.github/workflows/ii03012-coverage.yml'
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install matching Clang and LLVM tools
        run: sudo apt-get update && sudo apt-get install -y clang-18 llvm-18
      - name: Run tests and measure coverage
        run: PATH="/usr/lib/llvm-18/bin:$PATH" bash trunk/ii03012/task_02/coverage.sh
      - name: Show coverage summary
        run: |
          echo '#### C++ coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '~~~text' >> "$GITHUB_STEP_SUMMARY"
          cat trunk/ii03012/task_02/build/coverage/report/summary.txt >> "$GITHUB_STEP_SUMMARY"
          echo '~~~' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ii03012-coverage
          path: |
            trunk/ii03012/task_02/build/coverage/report/
            trunk/ii03012/task_02/build/coverage/test-results.xml
